[package]
name = "semi-persistent-abstract-domains"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false
autobins = false

[[bin]]
name = "semi-persistent-abstract-domains"
path = "src/main.rs"
required-features = ["bin"]

[features]
bin = []

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"
num-bigint = { workspace = true }
num-traits = { workspace = true }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
  'cfg(verus_keep_ghost)',
] }

[dev-dependencies]
rand = "0.10.1"
