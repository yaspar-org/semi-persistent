[workspace]
members = [
    "semi-persistent",
    "containers",
    "egraph",
    "traversals",
    "traversals/compile-tests",
    "traversals/derive",
    "abstract-domains",
    "containers-verus",
    "containers-verus/canary",
    "containers-conformance",
]
resolver = "3"

[workspace.dependencies]
winnow = "1"
proptest = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
hashbrown = { version = "0.17", features = ["raw-entry"] }
# foldhash: the default BuildHasher of hashbrown 0.17 (production `Map`'s
# index uses hashbrown, i.e. foldhash). SpMap's index uses the SAME hasher
# via std::HashMap<K, V, foldhash::fast::RandomState> for byte-identical
# hashing and matching performance. Pinned to the exact version production
# resolves transitively (Cargo.lock).
foldhash = "0.2"
ordered-float = "5"
rapidhash = "4"
criterion = { version = "0.8", features = ["html_reports"] }

# Release profile: applies to `cargo build --release`, `cargo bench`, and every
# criterion harness in the workspace.
#
# The hot generic code crosses the `containers-verus` -> `egraph` crate
# boundary (`SortedCursor`, `VecI`, `DenseId` methods), which the default
# `codegen-units = 16` and no-LTO settings leave unoptimized across. Measured
# gain over the defaults is 6-9% on end-to-end saturation for no code change;
# `lto = "fat"` beat `"thin"` by 5-7 points on the AC-completion path at
# identical compile cost. Numbers and method:
# `doc/perf-results/E0-release-profile.md`.
[profile.release]
lto = "fat"
codegen-units = 1
