[workspace]
members = [
    "semi-persistent",
    "containers",
    "egraph",
    "satcore",
    "traversals",
    "traversals/compile-tests",
    "traversals/derive",
    "abstract-domains",
    "containers-verus",
    "containers-verus/canary",
    "au-verus",
    "containers-conformance",
]
resolver = "3"

[workspace.dependencies]
winnow = "1"
proptest = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
hashbrown = { version = "0.17", features = ["raw-entry"] }
# foldhash: hashbrown 0.17's default builder (used by production `Map`) wraps
# foldhash::fast::RandomState. The verified SpMap instead uses its explicit
# IndexHasher, which delegates to foldhash::fast::FixedState::with_seed: the
# same hash algorithm with a controllable seed. Pinned to the exact version
# production resolves transitively (Cargo.lock).
foldhash = "0.2"
ordered-float = "5"
rapidhash = "4"
criterion = { version = "0.8", features = ["html_reports"] }

# Release profile: applies to `cargo build --release`, `cargo bench`, and every
# criterion harness in the workspace.
#
# The hot generic code crosses the `containers-verus` -> `egraph` crate
# boundary (`SortedCursor`, `VecI`, `DenseId` methods), so this profile enables
# whole-program optimization and one code-generation unit. Historical probes
# motivated the choice, but they are not branch-tip performance evidence.
# Compare profile changes with the maintained Criterion saturation benchmarks
# and retain their bootstrap confidence intervals.
[profile.release]
lto = "fat"
codegen-units = 1
