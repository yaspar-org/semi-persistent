[workspace]
members = [
    "semi-persistent",
    "containers",
    "egraph",
    "traversals",
    "traversals/derive",
    "abstract-domains",
    "containers-verus",
    "containers-verus/canary",
    "containers-conformance",
]
resolver = "3"

[workspace.dependencies]
winnow = "1"
proptest = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
hashbrown = { version = "0.17", features = ["raw-entry"] }
# foldhash: the default BuildHasher of hashbrown 0.17 (production `Map`'s
# index uses hashbrown, i.e. foldhash). SpMap's index uses the SAME hasher
# via std::HashMap<K, V, foldhash::fast::RandomState> for byte-identical
# hashing and matching performance. Pinned to the exact version production
# resolves transitively (Cargo.lock).
foldhash = "0.2"
ordered-float = "5"
rapidhash = "4"
criterion = { version = "0.8", features = ["html_reports"] }
