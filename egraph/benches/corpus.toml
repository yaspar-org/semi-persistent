# Benchmark manifest. One entry per program family; read by
# `egraph/benches/corpus.rs` (times our engine) and by
# `scripts/egglog-compare/compare.py` (times both engines).
#
# Fields:
#   types      the `--types` groups our binary needs for this translation
#   encodings  which of our encodings ship; each names a file
#              `egraph/tests/egg/bench/<name>.<encoding>.egg`
#   egglog     the counterpart under `scripts/egglog-compare/programs/`,
#              omitted when no comparable translation exists
#   blocked    present when the translation exists but cannot run, with the
#              missing feature as its value; such an entry is skipped by both
#              runners and by the test registration
#   upstream   the egglog test this was translated from
#
# The comparison script runs exactly the entries that carry `egglog` and no
# `blocked`, which is what "the subset that can also be run with egglog" means.

[egglog]
# Pinned so a campaign is reproducible. The script clones this revision into a
# temporary directory, builds it, and refuses to record a run if the checkout
# does not match.
repo = "https://github.com/egraphs-good/egglog"
rev = "7b1adf2"

[benchmarks.eqsat-basic]
types = "machine"
encodings = ["rules", "native"]
egglog = "eqsat-basic.egglog.egg"
upstream = "tests/eqsat-basic.egg"

[benchmarks.math-add-ac]
types = "machine"
encodings = ["rules", "native"]
egglog = "math-add-ac.egglog.egg"
upstream = "tests/math.egg (add-associativity fragment)"

[benchmarks.math-microbenchmark]
types = "machine"
encodings = ["rules", "native"]
egglog = "math-microbenchmark.egglog.egg"
upstream = "tests/math-microbenchmark.egg"

[benchmarks.calc]
types = "machine"
encodings = ["rules", "native"]
egglog = "calc.egglog.egg"
upstream = "tests/calc.egg"

[benchmarks.until]
types = "machine"
encodings = ["rules", "native"]
egglog = "until.egglog.egg"
upstream = "tests/until.egg"

[benchmarks.integer_math]
types = "machine"
encodings = ["rules", "native"]
egglog = "integer_math.egglog.egg"
upstream = "tests/integer_math.egg"

# Two native columns: AC on Times only, and that plus native A on MMul and
# Kron. See the ledger.
[benchmarks.matrix]
types = "machine"
encodings = ["rules", "native", "native-A"]
egglog = "matrix.egglog.egg"
upstream = "tests/matrix.egg"

[benchmarks.bdd]
types = "machine"
encodings = ["rules", "native"]
egglog = "bdd.egglog.egg"
upstream = "tests/bdd.egg"

[benchmarks.herbie]
types = "machine,bignum"
encodings = ["rules", "native"]
egglog = "herbie.egglog.egg"
upstream = "tests/web-demo/herbie.egg (scoped; see herbie-dropped.txt)"

# The native-AC dual is postponed; see the ledger.
[benchmarks.eqsolve]
types = "machine"
encodings = ["rules"]
egglog = "eqsolve.egglog.egg"
upstream = "tests/eqsolve.egg"

[benchmarks.combinators]
types = "machine"
encodings = ["rules"]
egglog = "combinators.egglog.egg"
upstream = "tests/combinators.egg"

# The native column is ACI (`:assoc-comm-idem` on myor).
[benchmarks.resolution]
types = "machine"
encodings = ["rules", "native"]
egglog = "resolution.egglog.egg"
upstream = "tests/resolution.egg"

[benchmarks.typecheck]
types = "machine"
encodings = ["rules"]
egglog = "typecheck.egglog.egg"
upstream = "tests/typecheck.egg"

[benchmarks.knapsack]
types = "machine"
encodings = ["rules"]
egglog = "knapsack.egglog.egg"
upstream = "tests/knapsack.egg"

[benchmarks.levenshtein-distance]
types = "machine"
encodings = ["rules"]
egglog = "levenshtein-distance.egglog.egg"
upstream = "tests/levenshtein-distance.egg"

[benchmarks.intersection]
types = "machine"
encodings = ["rules"]
egglog = "intersection.egglog.egg"
upstream = "tests/intersection.egg"

# Generated by egglog-bridge/examples/make-ac-bench.py at N=11; the ledger
# records the invocation and the N=13 measurements.
[benchmarks.acgen]
types = "machine"
# Roughly 22 s per iteration under both strategies, which would dominate the
# default Criterion run. Set EGRAPH_CORPUS_HEAVY=1 to register it. The
# comparison script still runs it.
heavy = true
encodings = ["rules", "native"]
egglog = "acgen.egglog.egg"
upstream = "egglog-bridge/examples/make-ac-bench.py --n 11"

# Blocked carriers: complete translations that cannot run yet. Both runners
# skip them; the ledgers state the condition that unblocks each.
[benchmarks.array]
types = "machine"
encodings = ["rules"]
egglog = "array.egglog.egg"
blocked = "datalog relations as rule atoms"
upstream = "tests/array.egg"

[benchmarks.subsume]
types = "machine"
encodings = ["rules"]
egglog = "subsume.egglog.egg"
blocked = "subsumption excludes matching, not extraction"
upstream = "tests/subsume.egg"
