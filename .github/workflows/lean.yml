name: Lean Proofs
on:
  pull_request:
    paths:
      - 'proofs/lean/**'
      - '.github/workflows/lean.yml'
  push:
    branches: [main]
    paths:
      - 'proofs/lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the Lean development under proofs/lean and runs its two gates:
  # no declaration uses `sorry`, and every `#print axioms` in the *Check.lean
  # files reports only propext, Classical.choice and Quot.sound
  # (proofs/lean/scripts/check-proofs.sh, which runs locally the same way).
  #
  # Mathlib is never compiled here: `lake exe cache get` downloads the prebuilt
  # oleans for the commit pinned in lake-manifest.json from Mathlib's cache
  # server. The toolchain is the one pinned in proofs/lean/lean-toolchain,
  # which elan selects from the project directory. The project's own modules
  # are rebuilt from source on every run; their build time is the measured
  # cost of the job, the cache download is the rest.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: proofs/lean
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          set -euo pipefail
          cat lean-toolchain
          lean --version
          lake --version

      # The Mathlib oleans for the pinned commit. `lake exe cache get` needs
      # the manifest's packages checked out, which `lake build` of the cache
      # executable does without building Mathlib itself.
      - name: Fetch the Mathlib cache
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build and gate
        run: bash scripts/check-proofs.sh
