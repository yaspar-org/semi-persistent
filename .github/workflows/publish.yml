name: Publish to crates.io
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust

      - name: Validate tag and workspace versions
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must have the form vMAJOR.MINOR.PATCH; got $tag"
            exit 1
          fi

          mapfile -t mismatches < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r --arg version "$version" \
                '.packages[] | select(.version != $version) | "\(.name)=\(.version)"'
          )
          if ((${#mismatches[@]})); then
            printf '::error::packages not at tag version %s: %s\n' \
              "$version" "${mismatches[*]}"
            exit 1
          fi

      # The release PR already passes formatting, Clippy, runtime, documentation,
      # and Verus CI. Keep one executable gate on the exact tagged tree.
      - run: cargo test --workspace --all-features --locked

      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Publish in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          publish_one() {
            local crate="$1"
            if cargo info --registry crates-io "${crate}@${version}" >/dev/null 2>&1; then
              echo "${crate}@${version} is already published; skipping upload"
              return
            fi

            cargo publish --locked -p "$crate"
            for attempt in $(seq 1 30); do
              if cargo info --registry crates-io "${crate}@${version}" >/dev/null 2>&1; then
                echo "${crate}@${version} is visible in the registry"
                return
              fi
              echo "waiting for ${crate}@${version} (${attempt}/30)"
              sleep 10
            done

            echo "::error::${crate}@${version} was not visible after five minutes"
            return 1
          }

          # The verified crate is uploaded once with a bootstrap token before
          # this first tagged release, so the first call normally skips it.
          publish_one semi-persistent-containers-verus
          publish_one semi-persistent-containers
          publish_one semi-persistent-traversals-derive
          publish_one semi-persistent-traversals
          publish_one semi-persistent-egraph
          publish_one semi-persistent
