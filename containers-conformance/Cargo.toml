[package]
name = "containers-conformance"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Differential, property, layout, and Criterion conformance checks between the
# executable verified containers and the independent reference implementation.
# This development-only crate is the only package that depends on both.

[dependencies]
semi-persistent-containers = { path = "../containers", version = "0.3.0" }
semi-persistent-containers-verus = { path = "../containers-verus", version = "0.3.0" }
# The Verus `define_id*!` macros expand `::vstd` paths, so a crate invoking them
# needs `vstd` in scope even though ghost specifications erase at runtime.
vstd = "=0.0.0-2026-08-02-0125"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[lib]
# Shared trace-runner / RNG helpers for the tests and benches.
path = "src/lib.rs"

[[bench]]
name = "retained_containers_bench"
harness = false

[[bench]]
name = "tracked_vec_bench"
harness = false

[[bench]]
name = "nested_mark_bench"
harness = false

[[bench]]
name = "bplus_cursor_bitset_bench"
harness = false

[[bench]]
name = "eclasses_bench"
harness = false
